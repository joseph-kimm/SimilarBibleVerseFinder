steps:
  # Step 1: Pull the previous image (cache) from Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_AR_REPO}/${_SERVICE_NAME}:latest || exit 0
    id: 'pull-cache'

  # Step 2: Build the Docker image using cache
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '-t'
      - '${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '.'
    id: 'build-image'
    waitFor: ['pull-cache']

  # Step 3: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
    id: 'push-image-sha'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_AR_REPO}/${_SERVICE_NAME}:latest'
    id: 'push-image-latest'
    waitFor: ['build-image']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_AR_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'deploy-cloud-run'
    waitFor: ['push-image-sha']

# Substitution variables
substitutions:
  _SERVICE_NAME: 'bible-verse-explorer'
  _REGION: 'asia-northeast1'
  # 👇 Replace YOUR_PROJECT_ID and YOUR_REPO_NAME below
  _AR_REPO: 'asia-northeast1-docker.pkg.dev/bible-verse-explorer-475102/bible-verse-explorer-repo'

# Build options
options:
  machineType: 'E2_MEDIUM'  
  logging: CLOUD_LOGGING_ONLY 