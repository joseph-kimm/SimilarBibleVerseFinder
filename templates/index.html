<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Similarity</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Bible Verse Similarity Finder</h1>
        <h2>Select a Bible Passage</h2>

        <!-- Bible Book Dropdown -->
        <label for="bookSelect" class="mt-3">Book:</label>
        <select id="bookSelect" class="form-select mt-2"></select>

        <!-- Chapter Dropdown -->
        <label for="chapterSelect" class="mt-3">Chapter:</label>
        <select id="chapterSelect" class="form-select mt-2"></select>

        <!-- Verse Dropdown -->
        <label for="verseSelect" class="mt-3">Verse:</label>
        <select id="verseSelect" class="form-select mt-2"></select>

        <button id="findSimilarButton" class="btn btn-primary mt-3">Search</button>

        <div id="loader" style="display: none;" class="mt-3 text-center">
            <div class="spinner" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Results Section -->
        <div id="similarityResults" class="mt-5" style="display: none;">
            <!-- Original Verse Section -->
            <div class="original-verse-section mb-4">
                <h3>Selected Verse</h3>
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" id="originalCitation"></h5>
                        <p class="card-text" id="originalText"></p>
                    </div>
                </div>
            </div>

            <!-- Similar Verses Section -->
            <div class="similar-verses-section">
                <h3>Similar Verses</h3>
                <div id="visualization" class="mb-4"></div>
                <div id="similarVersesList" class="row"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"
          }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
